# thatone configuration — every option, annotated.
#
# Copy to `thatone.yaml` (auto-discovered in the working directory), or
# point THATONE_CONFIG at it. Everything here is optional; omitted keys
# keep their defaults.
#
# Layering, highest priority first:
#   keyword arguments -> environment -> this file -> defaults
# Nested values use a double underscore:
#   THATONE__VISION__MODEL=claude-opus-5
#
# NO SECRETS LIVE HERE. Credentials are named by environment variable
# (`api_key_env`), never inlined, so this file is safe to commit.

storage:
  backend: sqlite              # sqlite | postgres (postgres not implemented yet)
  path: ./thatone.db     # one file; back it up by copying it
  blob_dir: ./thatone-blobs   # downloaded media and thumbnails
  # How long a writer waits on a locked database. Concurrent ingest workers
  # contend on write; 0 would turn routine contention into spurious failures.
  busy_timeout_ms: 30000

sampling:
  # adaptive  - keep a frame when the picture actually changed (default)
  # interval  - one frame every N seconds (poor fit for 1-4s GIFs)
  # count     - N evenly spaced frames (perfectly predictable per-item cost)
  strategy: adaptive

  min_frames: 3                # floor for adaptive; a static clip still gets context
  max_frames: 12               # HARD COST CEILING. The main dial.
  hamming_threshold: 12        # dHash bits of change that count as a new scene.
                               # Lower keeps more frames. 12/64 ~ "visibly different".

  interval_seconds: 2.0        # used by `interval`
  target_count: 8              # used by `count`

  max_decode_frames: 3000      # guard: a pathological file cannot exhaust memory
  frame_max_edge: 768          # THE OTHER COST DIAL. Image tokens scale with area
                               # (~w*h/750), so halving this quarters per-frame cost.
                               # 768 still resolves burned-in caption text.
  jpeg_quality: 85

vision:
  provider: anthropic          # anthropic | gemini | openai_compat | stub
  model: claude-sonnet-5
  strategy: single_call        # single_call | sequential | two_pass

  api_key_env: ANTHROPIC_API_KEY

  # Point at any OpenAI-compatible endpoint — including a model you host
  # yourself. This package never runs a model; that server is yours.
  #   provider: openai_compat
  #   base_url: https://vllm.internal.example.com/v1
  #   model: Qwen2.5-VL-7B-Instruct
  #   api_key_env: MY_VLLM_KEY
  base_url: null

  max_tokens: 4096
  effort: medium               # low | medium | high | xhigh | max
                               # Frame description is extraction, not deep
                               # reasoning; raise if narratives read shallow.
  timeout_seconds: 180
  max_retries: 3

  # Caches the (long, identical) extraction prompt across calls. Only engages
  # above the model's minimum cacheable prefix — 512 tokens on Opus 5, 1024 on
  # Sonnet 5, 4096 on Haiku 4.5. Below that it silently does nothing; verify
  # with usage.cache_read_input_tokens rather than assuming.
  cache_system_prompt: true

  # Half price, results within the hour instead of seconds. The right default
  # for a backfill, the wrong one for interactive indexing.
  use_batch_api: false

  caption_model: null          # two_pass only: cheap model for the per-frame pass

embedding:
  provider: openai             # openai | voyage | cohere | stub
  model: text-embedding-3-small
  dimensions: 1536             # MUST match the model's real output width.
                               # Recorded in the index at first write and checked
                               # on every search — a mismatch raises rather than
                               # silently returning nonsense.
  api_key_env: OPENAI_API_KEY
  base_url: null
  batch_size: 128
  timeout_seconds: 60
  max_retries: 3
  max_chunk_chars: 1200        # longer narratives get split on sentence bounds

search:
  default_limit: 20
  candidate_limit: 200         # retrieval depth per signal before fusion.
                               # Larger costs little and helps vague queries.
  rrf_k: 60                    # reciprocal rank fusion constant; lower sharpens
                               # toward the very top few results

  enable_lexical: true
  enable_dense: true

  rerank: none                 # none | llm
  rerank_model: claude-haiku-4-5
  rerank_top_n: 40             # only the head is rescored; reranking is a model
                               # call per item

  # BM25 column weights. A remembered verbatim caption is a far stronger signal
  # than an incidental word in a narrative, so on-screen text outweighs prose.
  weight_narrative: 1.0
  weight_on_screen_text: 3.0
  weight_tags: 1.5

fetch:
  max_bytes: 67108864          # 64 MiB; enforced while streaming, so a lying
                               # Content-Length cannot fill the disk
  max_duration_ms: 600000      # 10 minutes
  timeout_seconds: 60
  max_redirects: 5             # every hop is re-validated, not just the first
  user_agent: thatone/0.1
  concurrency: 8
  # Remote URLs are attacker-controlled in any real deployment. Non-public
  # destinations (loopback, RFC1918, and 169.254.0.0/16 cloud metadata) are
  # refused outright.
  allowed_schemes: [http, https]

jobs:
  queue: embedded              # embedded | celery (celery not implemented yet)
  concurrency: 4               # simultaneous in-flight provider calls.
                               # Tune against your rate limit.
  lease_seconds: 900           # must exceed the slowest realistic call, or a
                               # healthy worker's job gets stolen mid-flight
  max_attempts: 4
  backoff_base_seconds: 2.0
  backoff_max_seconds: 300.0
  claim_batch_size: 32

# Rates for the cost estimator. Published prices drift; these live in config
# precisely so correcting them is an edit here, not a release.
pricing:
  batch_discount: 0.5
  embedding_per_mtok: 0.02     # varies widely by provider — set it to yours
  models:
    claude-opus-5:
      input_per_mtok: 5.0
      output_per_mtok: 25.0
    claude-sonnet-5:
      input_per_mtok: 3.0
      output_per_mtok: 15.0
    claude-haiku-4-5:
      input_per_mtok: 1.0
      output_per_mtok: 5.0
