[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proper-search"
version = "0.1.0"
description = "Search GIFs and videos by what happens inside them, not by their filename."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "av>=12.0",
    "pillow>=10.3",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
postgres = ["psycopg[binary,pool]>=3.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/Mohammad-Hossein-Emami/proper-search"

[tool.hatch.build.targets.wheel]
packages = ["src/proper_search"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "live: hits a real provider API; requires credentials and costs money",
]

[tool.mypy]
python_version = "3.11"
packages = ["proper_search"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["av.*", "sqlite_vec.*"]
ignore_missing_imports = true
